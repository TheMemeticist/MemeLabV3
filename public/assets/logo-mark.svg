<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MemeLab CDA v3 logo">
  <defs>
    <linearGradient id="agar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="dish" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#dish)" stroke="url(#agar)" stroke-width="2.4"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#agar)" stroke-width="1" opacity="0.55"/>
  <!-- DNA helix backbone -->
  <path d="M32 12 C 27.5 17, 27.5 22, 32 27 C 36.5 32, 36.5 37, 32 42 C 27.5 47, 27.5 52, 32 52"
        fill="none" stroke="url(#agar)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Helix rungs -->
  <g stroke="url(#agar)" stroke-width="1.6" stroke-linecap="round">
    <line x1="28.5" y1="14.6" x2="35.5" y2="14.6"/>
    <line x1="28.6" y1="20.0" x2="35.4" y2="20.0"/>
    <line x1="28.5" y1="33.5" x2="35.5" y2="33.5"/>
    <line x1="28.5" y1="39.0" x2="35.5" y2="39.0"/>
    <line x1="28.5" y1="49.0" x2="35.5" y2="49.0"/>
  </g>
  <!-- Virus particle -->
  <g transform="translate(46 22)">
    <circle r="4.6" fill="url(#agar)"/>
    <circle r="1.8" fill="#fff8e6"/>
    <g stroke="url(#agar)" stroke-width="1.2" stroke-linecap="round">
      <line x1="0" y1="-4.6" x2="0" y2="-7.6"/>
      <line x1="0" y1="4.6" x2="0" y2="7.6"/>
      <line x1="-4.6" y1="0" x2="-7.6" y2="0"/>
      <line x1="4.6" y1="0" x2="7.6" y2="0"/>
      <line x1="-3.3" y1="-3.3" x2="-5.4" y2="-5.4"/>
      <line x1="3.3" y1="3.3" x2="5.4" y2="5.4"/>
      <line x1="-3.3" y1="3.3" x2="-5.4" y2="5.4"/>
      <line x1="3.3" y1="-3.3" x2="5.4" y2="-5.4"/>
    </g>
  </g>
</svg>
